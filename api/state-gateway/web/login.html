<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — Encore Monitoring</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/css/app.css">
<style>
  body.login-page {
    min-height: 100vh; display: grid; place-items: center; padding: 20px;
    background: #0b1020 url('/assets/scenes/radar-bg-1920x1080.png') center/cover no-repeat fixed;
    image-rendering: pixelated;
  }
  .login-scrim {
    position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 35%, rgba(11,16,32,0.45), rgba(6,10,20,0.86));
    pointer-events: none;
  }
  .login-card {
    position: relative; z-index: 2; width: min(410px, 94vw);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 28px 26px 24px; box-shadow: 0 24px 64px rgba(0,0,0,0.48);
    animation: modal-pop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .login-brand h1 { font-size: 20px; font-weight: 750; letter-spacing: -0.02em; }
  .login-brand p { font-size: 12.5px; color: var(--muted); }
  .login-err {
    display: none; margin-bottom: 12px; padding: 9px 12px; border-radius: 8px;
    background: var(--crit-bg); border: 1px solid var(--crit); color: var(--crit-fg); font-size: 12.5px; font-weight: 600;
  }
  .login-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body class="login-page">
  <div class="login-scrim"></div>
  <div class="login-card">
    <div class="login-brand">
      <encore-icon name="logo" size="3" live></encore-icon>
      <div>
        <h1>Encore Console</h1>
        <p>Sign in to continue monitoring</p>
      </div>
    </div>
    <div class="login-err" id="err-box"></div>
    <form id="login-form" onsubmit="doLogin(event)">
      <div class="form-row">
        <label for="u-inp">Username</label>
        <input id="u-inp" type="text" autocomplete="username" required autofocus placeholder="admin">
      </div>
      <div class="form-row">
        <label for="p-inp">Password</label>
        <input id="p-inp" type="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn primary" id="submit-btn" style="width:100%;justify-content:center;padding:9px 14px;margin-top:6px">Sign In</button>
    </form>
    <div class="login-foot">
      <span>RBAC Protected • Session Cookie</span>
      <select id="theme-sel" onchange="setTheme(this.value)" style="padding:3px 6px;font-size:11.5px">
        <option value="light">Crisp Light</option>
        <option value="dark">Midnight Slate</option>
        <option value="cyber">Encore Cyber</option>
        <option value="nord">Nordic Frost</option>
        <option value="emerald">Terminal Ops</option>
      </select>
    </div>
  </div>
  <script src="/js/encore-icons.js"></script>
  <script>
    function setTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('encore-theme', t);
    }
    const saved = localStorage.getItem('encore-theme') || 'cyber';
    setTheme(saved);
    document.getElementById('theme-sel').value = saved;

    async function doLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const err = document.getElementById('err-box');
      err.style.display = 'none';
      btn.disabled = true; btn.textContent = 'Signing in...';
      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            username: document.getElementById('u-inp').value.trim(),
            password: document.getElementById('p-inp').value
          })
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error || 'Login failed');
        window.location.href = '/';
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
