<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encore — Monitoring Dashboard</title>
<style>
  :root {
    --bg: #f6f8fa;
    --surface: #ffffff;
    --surface-2: #f1f4f8;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #2563eb;
    --ok: #10b981;
    --ok-bg: #ecfdf5;
    --ok-fg: #047857;
    --warn: #f59e0b;
    --warn-bg: #fffbeb;
    --warn-fg: #b45309;
    --crit: #ef4444;
    --crit-bg: #fef2f2;
    --crit-fg: #b91c1c;
    --unk: #8b5cf6;
    --unk-bg: #f5f3ff;
    --unk-fg: #6d28d9;
    --pend-bg: #f1f5f9;
    --pend-fg: #475569;
    --shadow: 0 1px 2px rgba(15,23,42,0.05), 0 4px 12px rgba(15,23,42,0.03);
    --radius: 10px;
  }
  [data-theme="dark"] {
    --bg: #0b1120;
    --surface: #111827;
    --surface-2: #1e293b;
    --border: #1f2937;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --ok-bg: rgba(16,185,129,0.14);
    --ok-fg: #34d399;
    --warn-bg: rgba(245,158,11,0.14);
    --warn-fg: #fbbf24;
    --crit-bg: rgba(239,68,68,0.14);
    --crit-fg: #f87171;
    --unk-bg: rgba(139,92,246,0.16);
    --unk-fg: #c4b5fd;
    --pend-bg: rgba(148,163,184,0.14);
    --pend-fg: #cbd5e1;
    --shadow: 0 1px 3px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1380px; margin: 0 auto; padding: 20px 24px 40px; }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #2563eb, #0ea5e9);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 16px;
    box-shadow: 0 2px 8px rgba(37,99,235,0.28);
  }
  .brand h1 { font-size: 18px; font-weight: 650; letter-spacing: -0.02em; }
  .brand span { display: block; font-size: 12px; color: var(--muted); }
  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 500;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.off { background: var(--crit); }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 500;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    cursor: pointer; transition: all 0.15s ease;
  }
  .btn:hover { background: var(--surface-2); border-color: var(--muted); }
  .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Summary Cards */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 14px; margin-bottom: 20px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow);
  }
  .card-head {
    display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px;
  }
  .card-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .card-total { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .metrics { display: flex; gap: 8px; flex-wrap: wrap; }
  .metric-chip {
    flex: 1; min-width: 72px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid transparent; cursor: pointer; transition: transform 0.12s ease, border-color 0.15s ease;
    text-align: left; background: var(--surface-2);
  }
  .metric-chip:hover { transform: translateY(-1px); border-color: var(--border); }
  .metric-chip .val { display: block; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .metric-chip .lbl { font-size: 11px; font-weight: 600; opacity: 0.85; }
  .c-ok { background: var(--ok-bg); color: var(--ok-fg); }
  .c-warn { background: var(--warn-bg); color: var(--warn-fg); }
  .c-crit { background: var(--crit-bg); color: var(--crit-fg); }
  .c-unk { background: var(--unk-bg); color: var(--unk-fg); }
  .c-pend { background: var(--pend-bg); color: var(--pend-fg); }

  /* Panel */
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  }
  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  .tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 8px; }
  .tab {
    padding: 6px 13px; border: none; border-radius: 6px; font-size: 13px; font-weight: 500;
    background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s;
  }
  .tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  input[type="search"], select {
    padding: 6px 10px; border-radius: 8px; font-size: 13px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text); outline: none;
  }
  input[type="search"] { width: 230px; }
  input[type="search"]:focus, select:focus { border-color: var(--accent); }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted);
    background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  td {
    padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle;
  }
  tbody tr:hover { background: var(--surface-2); }
  .badge {
    display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.03em; font-family: ui-monospace, SFMono-Regular, monospace;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; color: var(--muted); }
  .name-primary { font-weight: 600; color: var(--text); }
  .name-sub { font-size: 11.5px; color: var(--muted); }
  .output-cell {
    max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--muted); font-size: 12.5px;
  }
  .flags { display: inline-flex; gap: 4px; margin-left: 6px; }
  .flag-tag {
    font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 4px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
  }
  .actions { display: flex; gap: 4px; justify-content: flex-end; }
  .icon-btn {
    padding: 4px 7px; border-radius: 6px; font-size: 12px;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    cursor: pointer; transition: all 0.12s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--accent); }

  /* Footer / Pagination */
  .pager {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; font-size: 12.5px; color: var(--muted);
  }
  .empty { text-align: center; padding: 40px 16px; color: var(--muted); }

  /* Toast */
  #toast {
    position: fixed; right: 20px; bottom: 20px; padding: 10px 16px; border-radius: 8px;
    background: var(--text); color: var(--surface); font-size: 13px; font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2); opacity: 0; pointer-events: none;
    transform: translateY(8px); transition: all 0.2s ease; z-index: 50;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">E</div>
      <div>
        <h1>Encore Monitor</h1>
        <span id="sub-meta">Connecting to state gateway...</span>
      </div>
    </div>
    <div class="header-right">
      <div class="pill"><span id="conn-dot" class="dot"></span><span id="conn-label">Live</span></div>
      <div class="pill" id="events-pill">0 events</div>
      <button class="btn active" id="auto-btn" onclick="toggleAuto()">Auto 3s</button>
      <button class="btn" onclick="refreshAll()">Refresh</button>
      <button class="btn" id="theme-btn" onclick="toggleTheme()">Dark</button>
    </div>
  </header>

  <section class="grid">
    <div class="card">
      <div class="card-head">
        <span class="card-title">Hosts</span>
        <span class="card-total" id="h-total">-</span>
      </div>
      <div class="metrics">
        <button class="metric-chip c-ok" onclick="quickFilter('hosts', '0')"><span class="val" id="h-up">0</span><span class="lbl">UP</span></button>
        <button class="metric-chip c-crit" onclick="quickFilter('hosts', '1')"><span class="val" id="h-down">0</span><span class="lbl">DOWN</span></button>
        <button class="metric-chip c-warn" onclick="quickFilter('hosts', '2')"><span class="val" id="h-unreach">0</span><span class="lbl">UNREACH</span></button>
        <button class="metric-chip c-pend" onclick="quickFilter('hosts', '')"><span class="val" id="h-pend">0</span><span class="lbl">PENDING</span></button>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-title">Services</span>
        <span class="card-total" id="s-total">-</span>
      </div>
      <div class="metrics">
        <button class="metric-chip c-ok" onclick="quickFilter('services', '0')"><span class="val" id="s-ok">0</span><span class="lbl">OK</span></button>
        <button class="metric-chip c-warn" onclick="quickFilter('services', '1')"><span class="val" id="s-warn">0</span><span class="lbl">WARNING</span></button>
        <button class="metric-chip c-crit" onclick="quickFilter('services', '2')"><span class="val" id="s-crit">0</span><span class="lbl">CRITICAL</span></button>
        <button class="metric-chip c-unk" onclick="quickFilter('services', '3')"><span class="val" id="s-unk">0</span><span class="lbl">UNKNOWN</span></button>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <div class="tabs">
        <button class="tab active" id="tab-services" onclick="setTab('services')">Services</button>
        <button class="tab" id="tab-hosts" onclick="setTab('hosts')">Hosts</button>
        <button class="tab" id="tab-problems" onclick="setTab('problems')">Problems</button>
      </div>
      <div class="filters">
        <input type="search" id="search-input" placeholder="Search host, service, output..." oninput="onFilterChange()">
        <select id="state-select" onchange="onFilterChange()">
          <option value="">All States</option>
        </select>
        <select id="limit-select" onchange="onFilterChange()">
          <option value="25">25 / page</option>
          <option value="50" selected>50 / page</option>
          <option value="100">100 / page</option>
        </select>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="tbl-head"></thead>
        <tbody id="tbl-body"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>

    <div class="pager">
      <span id="pager-info">-</span>
      <div style="display:flex;gap:6px">
        <button class="btn" id="prev-btn" onclick="changePage(-1)">Prev</button>
        <button class="btn" id="next-btn" onclick="changePage(1)">Next</button>
      </div>
    </div>
  </section>
</div>
<div id="toast"></div>

<script>
const state = { tab: 'services', offset: 0, total: 0, auto: true, timer: null };

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('theme-btn').textContent = t === 'dark' ? 'Light' : 'Dark';
  localStorage.setItem('encore-theme', t);
}
applyTheme(localStorage.getItem('encore-theme') || 'light');
function toggleTheme() {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2600);
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function relTime(ts) {
  if (!ts) return 'never';
  const d = Math.max(0, Math.floor(Date.now() / 1000) - ts);
  if (d < 60) return d + 's ago';
  if (d < 3600) return Math.floor(d / 60) + 'm ago';
  if (d < 86400) return Math.floor(d / 3600) + 'h ago';
  return Math.floor(d / 86400) + 'd ago';
}

function hostBadge(h) {
  if (!h.has_been_checked) return '<span class="badge c-pend">PENDING</span>';
  const map = { 0: ['UP','c-ok'], 1: ['DOWN','c-crit'], 2: ['UNREACH','c-warn'] };
  const [lbl, cls] = map[h.current_state] || ['UNK','c-unk'];
  return `<span class="badge ${cls}">${lbl}</span>`;
}

function svcBadge(s) {
  if (!s.has_been_checked) return '<span class="badge c-pend">PENDING</span>';
  const map = { 0: ['OK','c-ok'], 1: ['WARN','c-warn'], 2: ['CRIT','c-crit'], 3: ['UNK','c-unk'] };
  const [lbl, cls] = map[s.current_state] || ['UNK','c-unk'];
  return `<span class="badge ${cls}">${lbl}</span>`;
}

function flagsHTML(o) {
  let out = '';
  if (o.acknowledged) out += '<span class="flag-tag">ACK</span>';
  if (o.downtime_depth > 0) out += '<span class="flag-tag">DT</span>';
  if (o.is_flapping) out += '<span class="flag-tag">FLAP</span>';
  return out ? `<span class="flags">${out}</span>` : '';
}

function populateStateSelect() {
  const sel = document.getElementById('state-select');
  const cur = sel.value;
  if (state.tab === 'hosts') {
    sel.innerHTML = '<option value="">All Host States</option><option value="0">UP</option><option value="1">DOWN</option><option value="2">UNREACHABLE</option>';
  } else if (state.tab === 'problems') {
    sel.innerHTML = '<option value="2">CRITICAL</option><option value="1">WARNING</option><option value="3">UNKNOWN</option>';
  } else {
    sel.innerHTML = '<option value="">All Service States</option><option value="0">OK</option><option value="1">WARNING</option><option value="2">CRITICAL</option><option value="3">UNKNOWN</option>';
  }
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
}

function setTab(tab) {
  state.tab = tab;
  state.offset = 0;
  ['services','hosts','problems'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
  });
  populateStateSelect();
  loadTable();
}

function quickFilter(tab, stateVal) {
  setTab(tab);
  document.getElementById('state-select').value = stateVal;
  loadTable();
}

function onFilterChange() {
  state.offset = 0;
  loadTable();
}

function changePage(dir) {
  const limit = Number(document.getElementById('limit-select').value);
  const next = state.offset + dir * limit;
  if (next < 0 || next >= state.total) return;
  state.offset = next;
  loadTable();
}

async function sendCmd(cmd, label) {
  try {
    const res = await fetch('/api/v1/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command: cmd })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    toast(label + ' queued');
    setTimeout(refreshAll, 700);
  } catch (e) {
    toast('Command failed: ' + e.message);
  }
}

function forceHost(name) {
  sendCmd(`SCHEDULE_FORCED_HOST_CHECK;${name};${Math.floor(Date.now()/1000)}`, `Force check ${name}`);
}
function forceSvc(host, desc) {
  sendCmd(`SCHEDULE_FORCED_SVC_CHECK;${host};${desc};${Math.floor(Date.now()/1000)}`, `Force check ${host}/${desc}`);
}
function ackSvc(host, desc) {
  sendCmd(`ACKNOWLEDGE_SVC_PROBLEM;${host};${desc};1;0;1;encore-ui;Acknowledged via Encore Dashboard`, `ACK ${host}/${desc}`);
}
function dtSvc(host, desc) {
  const now = Math.floor(Date.now()/1000);
  sendCmd(`SCHEDULE_SVC_DOWNTIME;${host};${desc};${now};${now+3600};1;0;0;encore-ui;1h maintenance`, `1h downtime ${host}/${desc}`);
}

async function loadMeta() {
  const [hRes, sRes] = await Promise.all([fetch('/health'), fetch('/api/v1/summary')]);
  const health = await hRes.json();
  const sum = await sRes.json();

  const dot = document.getElementById('conn-dot');
  dot.classList.toggle('off', !health.connected);
  document.getElementById('conn-label').textContent = health.connected ? 'Live' : 'Reconnecting';
  document.getElementById('events-pill').textContent = (health.events_applied || 0).toLocaleString() + ' events';
  document.getElementById('sub-meta').textContent =
    `PID ${sum.program.pid} • Updated ${new Date().toLocaleTimeString()}`;

  document.getElementById('h-total').textContent = sum.hosts.total;
  document.getElementById('h-up').textContent = sum.hosts.up;
  document.getElementById('h-down').textContent = sum.hosts.down;
  document.getElementById('h-unreach').textContent = sum.hosts.unreachable;
  document.getElementById('h-pend').textContent = sum.hosts.pending;

  document.getElementById('s-total').textContent = sum.services.total;
  document.getElementById('s-ok').textContent = sum.services.ok;
  document.getElementById('s-warn').textContent = sum.services.warning;
  document.getElementById('s-crit').textContent = sum.services.critical;
  document.getElementById('s-unk').textContent = sum.services.unknown;
}

async function loadTable() {
  const q = document.getElementById('search-input').value.trim();
  const st = document.getElementById('state-select').value;
  const limit = Number(document.getElementById('limit-select').value);
  const params = new URLSearchParams({ limit, offset: state.offset });
  if (q) params.set('search', q);
  if (st !== '') params.set('state', st);

  const head = document.getElementById('tbl-head');
  const body = document.getElementById('tbl-body');

  if (state.tab === 'hosts') {
    head.innerHTML = '<tr><th>Status</th><th>Host</th><th>Attempt</th><th>Last Check</th><th>Output</th><th style="text-align:right">Actions</th></tr>';
    const data = await (await fetch('/api/v1/hosts?' + params)).json();
    state.total = data.total;
    if (!data.hosts.length) {
      body.innerHTML = '<tr><td colspan="6" class="empty">No matching hosts</td></tr>';
    } else {
      body.innerHTML = data.hosts.map(h => `
        <tr>
          <td>${hostBadge(h)}</td>
          <td><div class="name-primary">${esc(h.name)}${flagsHTML(h)}</div><div class="name-sub">${esc(h.address)}</div></td>
          <td class="mono">${h.current_attempt}/${h.max_attempts}</td>
          <td class="mono">${relTime(h.last_check)}</td>
          <td class="output-cell" title="${esc(h.plugin_output)}">${esc(h.plugin_output || '-')}</td>
          <td class="actions">
            <button class="icon-btn" title="Force check" onclick="forceHost('${esc(h.name)}')">↻</button>
          </td>
        </tr>`).join('');
    }
  } else {
    head.innerHTML = '<tr><th>Status</th><th>Host / Service</th><th>Attempt</th><th>Last Check</th><th>Output</th><th style="text-align:right">Actions</th></tr>';
    const data = await (await fetch('/api/v1/services?' + params)).json();
    state.total = data.total;
    if (!data.services.length) {
      body.innerHTML = '<tr><td colspan="6" class="empty">No matching services</td></tr>';
    } else {
      body.innerHTML = data.services.map(s => `
        <tr>
          <td>${svcBadge(s)}</td>
          <td><div class="name-primary">${esc(s.description)}${flagsHTML(s)}</div><div class="name-sub">${esc(s.host_name)}</div></td>
          <td class="mono">${s.current_attempt}/${s.max_attempts}</td>
          <td class="mono">${relTime(s.last_check)}</td>
          <td class="output-cell" title="${esc(s.plugin_output)}">${esc(s.plugin_output || '-')}</td>
          <td class="actions">
            <button class="icon-btn" title="Force check" onclick="forceSvc('${esc(s.host_name)}','${esc(s.description)}')">↻</button>
            ${s.current_state > 0 && !s.acknowledged ? `<button class="icon-btn" title="Acknowledge" onclick="ackSvc('${esc(s.host_name)}','${esc(s.description)}')">✓</button>` : ''}
            <button class="icon-btn" title="1h Downtime" onclick="dtSvc('${esc(s.host_name)}','${esc(s.description)}')">⏱</button>
          </td>
        </tr>`).join('');
    }
  }

  const start = state.total ? state.offset + 1 : 0;
  const end = Math.min(state.offset + limit, state.total);
  document.getElementById('pager-info').textContent = `Showing ${start}–${end} of ${state.total.toLocaleString()}`;
  document.getElementById('prev-btn').disabled = state.offset === 0;
  document.getElementById('next-btn').disabled = end >= state.total;
}

async function refreshAll() {
  try {
    await Promise.all([loadMeta(), loadTable()]);
  } catch (e) {
    document.getElementById('conn-dot').classList.add('off');
    document.getElementById('conn-label').textContent = 'Offline';
  }
}

function toggleAuto() {
  state.auto = !state.auto;
  const btn = document.getElementById('auto-btn');
  btn.classList.toggle('active', state.auto);
  btn.textContent = state.auto ? 'Auto 3s' : 'Paused';
}

populateStateSelect();
refreshAll();
