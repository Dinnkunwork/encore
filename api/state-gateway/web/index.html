<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encore — Monitoring & Management</title>
<style>
  :root {
    --bg: #f6f8fa;
    --surface: #ffffff;
    --surface-2: #f1f4f8;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #2563eb;
    --accent-soft: rgba(37,99,235,0.1);
    --ok: #10b981;
    --ok-bg: #ecfdf5;
    --ok-fg: #047857;
    --warn: #f59e0b;
    --warn-bg: #fffbeb;
    --warn-fg: #b45309;
    --crit: #ef4444;
    --crit-bg: #fef2f2;
    --crit-fg: #b91c1c;
    --unk: #8b5cf6;
    --unk-bg: #f5f3ff;
    --unk-fg: #6d28d9;
    --pend-bg: #f1f5f9;
    --pend-fg: #475569;
    --shadow: 0 1px 2px rgba(15,23,42,0.05), 0 4px 12px rgba(15,23,42,0.03);
    --radius: 10px;
  }
  [data-theme="dark"] {
    --bg: #0b1120;
    --surface: #111827;
    --surface-2: #1e293b;
    --border: #1f2937;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-soft: rgba(59,130,246,0.18);
    --ok-bg: rgba(16,185,129,0.14);
    --ok-fg: #34d399;
    --warn-bg: rgba(245,158,11,0.14);
    --warn-fg: #fbbf24;
    --crit-bg: rgba(239,68,68,0.14);
    --crit-fg: #f87171;
    --unk-bg: rgba(139,92,246,0.16);
    --unk-fg: #c4b5fd;
    --pend-bg: rgba(148,163,184,0.14);
    --pend-fg: #cbd5e1;
    --shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1420px; margin: 0 auto; padding: 18px 24px 48px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; flex-wrap: wrap;
    margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #2563eb, #0ea5e9);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 16px;
    box-shadow: 0 2px 8px rgba(37,99,235,0.28);
  }
  .brand h1 { font-size: 17px; font-weight: 650; letter-spacing: -0.02em; }
  .brand span { display: block; font-size: 12px; color: var(--muted); }
  .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 500;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
  }
  .pill.pending-pill { background: var(--warn-bg); border-color: var(--warn); color: var(--warn-fg); cursor: pointer; display: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.off { background: var(--crit); }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 500;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    cursor: pointer; transition: all 0.14s ease;
  }
  .btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--muted); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn.danger { background: var(--crit-bg); border-color: var(--crit); color: var(--crit-fg); }
  .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-sm { padding: 4px 9px; font-size: 12px; }

  /* Summary Cards */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
    gap: 14px; margin-bottom: 18px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 15px 18px; box-shadow: var(--shadow);
  }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .card-title { font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .card-total { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .metrics { display: flex; gap: 7px; flex-wrap: wrap; }
  .metric-chip {
    flex: 1; min-width: 64px; padding: 7px 9px; border-radius: 8px;
    border: 1px solid transparent; cursor: pointer; transition: transform 0.12s, border-color 0.15s;
    text-align: left; background: var(--surface-2);
  }
  .metric-chip:hover { transform: translateY(-1px); border-color: var(--border); }
  .metric-chip .val { display: block; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .metric-chip .lbl { font-size: 10.5px; font-weight: 600; opacity: 0.85; }
  .c-ok { background: var(--ok-bg); color: var(--ok-fg); }
  .c-warn { background: var(--warn-bg); color: var(--warn-fg); }
  .c-crit { background: var(--crit-bg); color: var(--crit-fg); }
  .c-unk { background: var(--unk-bg); color: var(--unk-fg); }
  .c-pend { background: var(--pend-bg); color: var(--pend-fg); }

  /* Panel & Tabs */
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  }
  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  .tabs { display: flex; gap: 3px; background: var(--surface-2); padding: 3px; border-radius: 8px; flex-wrap: wrap; }
  .tab {
    padding: 6px 12px; border: none; border-radius: 6px; font-size: 12.5px; font-weight: 550;
    background: transparent; color: var(--muted); cursor: pointer; transition: all 0.14s;
  }
  .tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .filters { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  input[type="search"], input[type="text"], input[type="number"], select, textarea {
    padding: 6px 10px; border-radius: 8px; font-size: 13px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text); outline: none;
    font-family: inherit;
  }
  input[type="search"] { width: 210px; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  .chk-pill {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted);
    padding: 5px 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); cursor: pointer;
  }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; padding: 9px 13px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted);
    background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  th.sortable { cursor: pointer; }
  th.sortable:hover { color: var(--text); }
  td { padding: 9px 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr:hover { background: var(--surface-2); }
  tr.group-row td { background: var(--surface-2); font-weight: 650; font-size: 12.5px; padding: 7px 13px; }
  .badge {
    display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.03em; font-family: ui-monospace, SFMono-Regular, monospace;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; color: var(--muted); }
  .name-primary { font-weight: 600; color: var(--text); }
  .name-sub { font-size: 11.5px; color: var(--muted); }
  .output-cell { max-width: 390px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 12.5px; }
  .flags { display: inline-flex; gap: 4px; margin-left: 6px; }
  .flag-tag {
    font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 4px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
  }
  .actions { display: flex; gap: 4px; justify-content: flex-end; }
  .icon-btn {
    padding: 4px 7px; border-radius: 6px; font-size: 12px;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    cursor: pointer; transition: all 0.12s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--accent); }
  .pager {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 16px; font-size: 12.5px; color: var(--muted);
  }
  .empty { text-align: center; padding: 38px 16px; color: var(--muted); }

  /* Group Overview Grid */
  .group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; padding: 16px; }
  .gcard {
    border: 1px solid var(--border); border-radius: 10px; padding: 14px;
    background: var(--bg); cursor: pointer; transition: border-color 0.15s, transform 0.12s;
  }
  .gcard:hover { border-color: var(--accent); transform: translateY(-1px); }
  .gcard h3 { font-size: 14px; font-weight: 650; margin-bottom: 2px; }
  .gcard p { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: flex; margin-bottom: 8px; }
  .bar-ok { background: var(--ok); }
  .bar-warn { background: var(--warn); }
  .bar-crit { background: var(--crit); }
  .bar-unk { background: var(--unk); }

  /* Manage Section */
  .manage-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 12px 16px; background: var(--surface-2); border-bottom: 1px solid var(--border);
  }
  .console-out {
    margin: 12px 16px; padding: 12px; border-radius: 8px; font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 12px; white-space: pre-wrap; max-height: 200px; overflow: auto;
    background: var(--bg); border: 1px solid var(--border); display: none;
  }
  .toggle-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; padding: 16px; }
  .toggle-card {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg);
  }

  /* Drawer & Modal */
  .backdrop {
    position: fixed; inset: 0; background: rgba(15,23,42,0.45); z-index: 40;
    display: none; align-items: center; justify-content: center;
  }
  .backdrop.open { display: flex; }
  .modal {
    width: min(540px, 94vw); max-height: 90vh; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .modal h2 { font-size: 16px; font-weight: 650; margin-bottom: 14px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .form-row.full { grid-column: 1 / -1; }
  .form-row label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }

  .drawer-wrap {
    position: fixed; inset: 0; background: rgba(15,23,42,0.35); z-index: 45; display: none; justify-content: flex-end;
  }
  .drawer-wrap.open { display: flex; }
  .drawer {
    width: min(520px, 96vw); height: 100%; overflow-y: auto;
    background: var(--surface); border-left: 1px solid var(--border); padding: 20px 22px;
    box-shadow: -8px 0 32px rgba(0,0,0,0.2);
  }
  .drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
  .kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  .kv-box { padding: 8px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); }
  .kv-box .k { font-size: 10.5px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .kv-box .v { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .perf-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .perf-chip { padding: 4px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-size: 11.5px; font-family: ui-monospace, monospace; }

  #toast {
    position: fixed; right: 20px; bottom: 20px; padding: 10px 16px; border-radius: 8px;
    background: var(--text); color: var(--surface); font-size: 13px; font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,0.22); opacity: 0; pointer-events: none;
    transform: translateY(8px); transition: all 0.2s ease; z-index: 60;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">E</div>
      <div>
        <h1>Encore Monitor</h1>
        <span id="sub-meta">Connecting to state gateway...</span>
      </div>
    </div>
    <div class="header-right">
      <button class="pill pending-pill" id="pending-pill" onclick="setTab('manage')">Pending Changes</button>
      <div class="pill"><span id="conn-dot" class="dot"></span><span id="conn-label">Live</span></div>
      <div class="pill" id="events-pill">0 events</div>
      <button class="btn active" id="auto-btn" onclick="toggleAuto()">Auto 3s</button>
      <button class="btn" onclick="refreshAll()">Refresh</button>
      <button class="btn" id="theme-btn" onclick="toggleTheme()">Dark</button>
    </div>
  </header>

  <section class="grid">
    <div class="card">
      <div class="card-head">
        <span class="card-title">Hosts</span>
        <div>
          <span class="badge c-crit" id="h-unhandled-badge" style="display:none;margin-right:6px;cursor:pointer" onclick="quickUnhandled('hosts')">0 unhandled</span>
          <span class="card-total" id="h-total">-</span>
        </div>
      </div>
      <div class="metrics">
        <button class="metric-chip c-ok" onclick="quickFilter('hosts','0')"><span class="val" id="h-up">0</span><span class="lbl">UP</span></button>
        <button class="metric-chip c-crit" onclick="quickFilter('hosts','1')"><span class="val" id="h-down">0</span><span class="lbl">DOWN</span></button>
        <button class="metric-chip c-warn" onclick="quickFilter('hosts','2')"><span class="val" id="h-unreach">0</span><span class="lbl">UNREACH</span></button>
        <button class="metric-chip c-pend" onclick="quickFilter('hosts','')"><span class="val" id="h-pend">0</span><span class="lbl">PENDING</span></button>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-title">Services</span>
        <div>
          <span class="badge c-crit" id="s-unhandled-badge" style="display:none;margin-right:6px;cursor:pointer" onclick="quickUnhandled('services')">0 unhandled</span>
          <span class="card-total" id="s-total">-</span>
        </div>
      </div>
      <div class="metrics">
        <button class="metric-chip c-ok" onclick="quickFilter('services','0')"><span class="val" id="s-ok">0</span><span class="lbl">OK</span></button>
        <button class="metric-chip c-warn" onclick="quickFilter('services','1')"><span class="val" id="s-warn">0</span><span class="lbl">WARN</span></button>
        <button class="metric-chip c-crit" onclick="quickFilter('services','2')"><span class="val" id="s-crit">0</span><span class="lbl">CRIT</span></button>
        <button class="metric-chip c-unk" onclick="quickFilter('services','3')"><span class="val" id="s-unk">0</span><span class="lbl">UNK</span></button>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-title">Health Overview</span>
        <span class="card-total" id="health-pct">-</span>
      </div>
      <div class="bar" id="health-bar" style="height:10px;margin:8px 0 12px"></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted)">
        <span id="daemon-flags">Checks: - • Notify: -</span>
        <span id="shortcut-hint">Press <b>/</b> to search</span>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <div class="tabs">
        <button class="tab active" id="tab-services" onclick="setTab('services')">Services</button>
        <button class="tab" id="tab-hosts" onclick="setTab('hosts')">Hosts</button>
        <button class="tab" id="tab-problems" onclick="setTab('problems')">Problems</button>
        <button class="tab" id="tab-groups" onclick="setTab('groups')">Groups</button>
        <button class="tab" id="tab-downtimes" onclick="setTab('downtimes')">Downtimes</button>
        <button class="tab" id="tab-manage" onclick="setTab('manage')">Manage</button>
      </div>
      <div class="filters" id="monitor-filters">
        <input type="search" id="search-input" placeholder="Search host, IP, service, output..." oninput="onFilterChange()">
        <select id="hg-select" onchange="onFilterChange()"><option value="">All Hostgroups</option></select>
        <select id="sg-select" onchange="onFilterChange()"><option value="">All Servicegroups</option></select>
        <select id="state-select" onchange="onFilterChange()"><option value="">All States</option></select>
        <select id="sort-select" onchange="onFilterChange()">
          <option value="severity">Sort: Severity</option>
          <option value="name">Sort: Name</option>
          <option value="last_check">Sort: Last Check</option>
          <option value="duration">Sort: State Age</option>
        </select>
        <label class="chk-pill"><input type="checkbox" id="unhandled-chk" onchange="onFilterChange()"> Unhandled</label>
        <button class="btn btn-sm" id="group-view-btn" onclick="toggleGroupByHost()" title="Group services by host">Grouped</button>
        <select id="limit-select" onchange="onFilterChange()">
          <option value="25">25</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
        </select>
      </div>
    </div>

    <!-- Monitoring Table View -->
    <div id="view-table">
      <div class="table-wrap">
        <table>
          <thead id="tbl-head"></thead>
          <tbody id="tbl-body"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody>
        </table>
      </div>
      <div class="pager">
        <span id="pager-info">-</span>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm" id="prev-btn" onclick="changePage(-1)">Prev</button>
          <button class="btn btn-sm" id="next-btn" onclick="changePage(1)">Next</button>
        </div>
      </div>
    </div>

    <!-- Groups Overview View -->
    <div id="view-groups" style="display:none">
      <div style="padding:14px 16px 0;font-size:12px;font-weight:650;text-transform:uppercase;color:var(--muted)">Hostgroups</div>
      <div class="group-grid" id="hg-cards"></div>
      <div style="padding:4px 16px 0;font-size:12px;font-weight:650;text-transform:uppercase;color:var(--muted)">Servicegroups</div>
      <div class="group-grid" id="sg-cards"></div>
    </div>

    <!-- Downtimes View -->
    <div id="view-downtimes" style="display:none">
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Target</th><th>Window</th><th>Status</th><th>Author / Comment</th><th style="text-align:right">Actions</th></tr></thead>
          <tbody id="dt-body"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- Manage Config & System View -->
    <div id="view-manage" style="display:none">
      <div class="manage-bar">
        <div class="tabs">
          <button class="tab active" id="mtab-hosts" onclick="setManageTab('hosts')">Hosts</button>
          <button class="tab" id="mtab-services" onclick="setManageTab('services')">Services</button>
          <button class="tab" id="mtab-commands" onclick="setManageTab('commands')">Commands</button>
          <button class="tab" id="mtab-groups" onclick="setManageTab('groups')">Groups & Contacts</button>
          <button class="tab" id="mtab-system" onclick="setManageTab('system')">System & Backups</button>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm" id="m-add-btn" onclick="openAddModal()">+ Add New</button>
          <button class="btn btn-sm" onclick="runValidate(false)">Validate (nagios -v)</button>
          <button class="btn btn-sm primary" onclick="runValidate(true)">Apply & Reload</button>
        </div>
      </div>
      <pre class="console-out" id="validate-console"></pre>
      <div id="manage-content"></div>
    </div>
  </section>
</div>

<!-- Detail Slide-Over Drawer -->
<div class="drawer-wrap" id="drawer-wrap" onclick="if(event.target===this)closeDrawer()">
  <div class="drawer" id="drawer-body"></div>
</div>

<!-- Reusable Modal -->
<div class="backdrop" id="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<div id="toast"></div>

<script>
const S = {
  tab: 'services',
  manageTab: 'hosts',
  offset: 0,
  total: 0,
  auto: true,
  groupByHost: false,
  summary: null,
  hostgroups: [],
  servicegroups: [],
  managed: { enabled: false, pending_changes: false, config: { hosts:[], services:[], commands:[], contacts:[], hostgroups:[], servicegroups:[] } },

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('theme-btn').textContent = t === 'dark' ? 'Light' : 'Dark';
  localStorage.setItem('encore-theme', t);
}

function toggleTheme() { applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }

document.addEventListener('keydown', e => {
  if (e.key === '/' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) {
    e.preventDefault();
    const inp = document.getElementById('search-input');
    if (inp) inp.focus();
  } else if (e.key === 'Escape') {
    closeDrawer();
    closeModal();
  }
});

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2800);
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function relTime(ts) {
  if (!ts) return 'never';
  const d = Math.max(0, Math.floor(Date.now()/1000) - ts);
  if (d < 60) return d + 's ago';
  if (d < 3600) return Math.floor(d/60) + 'm ago';
  if (d < 86400) return Math.floor(d/3600) + 'h ago';
  return Math.floor(d/86400) + 'd ago';
}
function durStr(ts) {
  if (!ts) return '-';
  const d = Math.max(0, Math.floor(Date.now()/1000) - ts);
  const days = Math.floor(d/86400), hrs = Math.floor((d%86400)/3600), mins = Math.floor((d%3600)/60);
  if (days > 0) return `${days}d ${hrs}h`;
  if (hrs > 0) return `${hrs}h ${mins}m`;
  return `${mins}m ${d%60}s`;
}
function hostBadge(h) {
  if (!h.has_been_checked) return '<span class="badge c-pend">PENDING</span>';
  const m = {0:['UP','c-ok'],1:['DOWN','c-crit'],2:['UNREACH','c-warn']};
  const [l,c] = m[h.current_state] || ['UNK','c-unk'];
  return `<span class="badge ${c}">${l}</span>`;
}
function svcBadge(s) {
  if (!s.has_been_checked) return '<span class="badge c-pend">PENDING</span>';
  const m = {0:['OK','c-ok'],1:['WARN','c-warn'],2:['CRIT','c-crit'],3:['UNK','c-unk']};
  const [l,c] = m[s.current_state] || ['UNK','c-unk'];
  return `<span class="badge ${c}">${l}</span>`;
}
function flagsHTML(o) {
  let out = '';
  if (o.acknowledged) out += '<span class="flag-tag">ACK</span>';
  if (o.downtime_depth > 0) out += '<span class="flag-tag">DT</span>';
  if (o.is_flapping) out += '<span class="flag-tag">FLAP</span>';
  if (o.state_type === 0 && o.current_state > 0) out += '<span class="flag-tag">SOFT</span>';
  return out ? `<span class="flags">${out}</span>` : '';
}

function populateStateSelect() {
  const sel = document.getElementById('state-select');
  const cur = sel.value;
  if (S.tab === 'hosts') {
    sel.innerHTML = '<option value="">All Host States</option><option value="0">UP</option><option value="1">DOWN</option><option value="2">UNREACHABLE</option>';
  } else if (S.tab === 'problems') {
    sel.innerHTML = '<option value="2">CRITICAL</option><option value="1">WARNING</option><option value="3">UNKNOWN</option>';
  } else {
    sel.innerHTML = '<option value="">All Service States</option><option value="0">OK</option><option value="1">WARNING</option><option value="2">CRITICAL</option><option value="3">UNKNOWN</option>';
  }
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
}

function setTab(tab) {
  S.tab = tab;
  S.offset = 0;
  ['services','hosts','problems','groups','downtimes','manage'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
  });
  const isTable = ['services','hosts','problems'].includes(tab);
  document.getElementById('monitor-filters').style.display = isTable ? 'flex' : 'none';
  document.getElementById('sg-select').style.display = tab === 'hosts' ? 'none' : '';
  document.getElementById('group-view-btn').style.display = tab === 'hosts' ? 'none' : '';
  document.getElementById('view-table').style.display = isTable ? 'block' : 'none';
  document.getElementById('view-groups').style.display = tab === 'groups' ? 'block' : 'none';
  document.getElementById('view-downtimes').style.display = tab === 'downtimes' ? 'block' : 'none';
  document.getElementById('view-manage').style.display = tab === 'manage' ? 'block' : 'none';

  if (isTable) { populateStateSelect(); loadTable(); }
  else if (tab === 'groups') loadGroups();
  else if (tab === 'downtimes') loadDowntimes();
  else if (tab === 'manage') loadManage();
}

function quickFilter(tab, stateVal) {
  document.getElementById('unhandled-chk').checked = false;

  document.getElementById('state-select').value = stateVal;

function quickUnhandled(tab) {

}
function jumpToGroup(type, name) {
  document.getElementById('hg-select').value = type === 'hg' ? name : '';
  document.getElementById('sg-select').value = type === 'sg' ? name : '';

function toggleGroupByHost() {

}

function changePage(dir) {

function toggleAuto() {

  b.classList.toggle('active', S.auto);

async function sendCmd(cmd, label) {
  try {
    const res = await fetch('/api/v1/command', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({command: cmd})
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || res.statusText);
    toast(label + ' queued');
    setTimeout(refreshAll, 700);
  } catch (e) { toast('Error: ' + e.message); }
}

async function loadTable() {
  const q = document.getElementById('search-input').value.trim();
  const st = document.getElementById('state-select').value;
  const hg = document.getElementById('hg-select').value;
  const sg = document.getElementById('sg-select').value;
  const sort = document.getElementById('sort-select').value;
  const unhandled = document.getElementById('unhandled-chk').checked;
  const limit = Number(document.getElementById('limit-select').value);

  const params = new URLSearchParams({ limit, offset: S.offset, sort });
  if (q) params.set('search', q);
  if (st !== '') params.set('state', st);
  if (hg) params.set('hostgroup', hg);
  if (sg && S.tab !== 'hosts') params.set('servicegroup', sg);
  if (unhandled) params.set('unhandled', '1');

  const head = document.getElementById('tbl-head');
  const body = document.getElementById('tbl-body');

  if (S.tab === 'hosts') {
    head.innerHTML = '<tr><th>Status</th><th>Host</th><th>Duration</th><th>Last Check</th><th>Output</th><th style="text-align:right">Actions</th></tr>';
    const data = await (await fetch('/api/v1/hosts?' + params)).json();
    S.total = data.total;
    S.lastItems = data.hosts;
    if (!data.hosts.length) {
      body.innerHTML = '<tr><td colspan="6" class="empty">No matching hosts</td></tr>';
    } else {
      body.innerHTML = data.hosts.map((h, idx) => `
        <tr class="clickable" onclick="openHostDrawer(${idx})">
          <td>${hostBadge(h)}</td>
          <td><div class="name-primary">${esc(h.name)}${flagsHTML(h)}</div><div class="name-sub">${esc(h.address)}</div></td>
          <td class="mono">${durStr(h.last_state_change)}</td>
          <td class="mono">${relTime(h.last_check)}</td>
          <td class="output-cell" title="${esc(h.plugin_output)}">${esc(h.plugin_output || '-')}</td>
          <td class="actions" onclick="event.stopPropagation()">
            <button class="icon-btn" title="Force check" onclick="sendCmd('SCHEDULE_FORCED_HOST_CHECK;${esc(h.name)};'+Math.floor(Date.now()/1000),'Force check ${esc(h.name)}')">↻</button>
            <button class="icon-btn" title="Downtime" onclick="openDowntimeModal('host','${esc(h.name)}','')">⏱</button>
          </td>
        </tr>`).join('');
    }
  } else {
    head.innerHTML = '<tr><th>Status</th><th>Host / Service</th><th>Duration</th><th>Last Check</th><th>Output</th><th style="text-align:right">Actions</th></tr>';
    const data = await (await fetch('/api/v1/services?' + params)).json();
    S.total = data.total;
    S.lastItems = data.services;
    if (!data.services.length) {
      body.innerHTML = '<tr><td colspan="6" class="empty">No matching services</td></tr>';
    } else {
      let html = '';
      let lastHost = null;
      data.services.forEach((s, idx) => {
        if (S.groupByHost && s.host_name !== lastHost) {
          lastHost = s.host_name;
          html += `<tr class="group-row"><td colspan="6">${esc(s.host_name)}</td></tr>`;
        }
        html += `
        <tr class="clickable" onclick="openSvcDrawer(${idx})">
          <td>${svcBadge(s)}</td>
          <td><div class="name-primary">${esc(s.description)}${flagsHTML(s)}</div>${S.groupByHost ? '' : `<div class="name-sub">${esc(s.host_name)}</div>`}</td>
          <td class="mono">${durStr(s.last_state_change)}</td>
          <td class="mono">${relTime(s.last_check)}</td>
          <td class="output-cell" title="${esc(s.plugin_output)}">${esc(s.plugin_output || '-')}</td>
          <td class="actions" onclick="event.stopPropagation()">
            <button class="icon-btn" title="Force check" onclick="sendCmd('SCHEDULE_FORCED_SVC_CHECK;${esc(s.host_name)};${esc(s.description)};'+Math.floor(Date.now()/1000),'Force check')">↻</button>
            ${s.current_state > 0 && !s.acknowledged ? `<button class="icon-btn" title="Acknowledge" onclick="openAckModal('service','${esc(s.host_name)}','${esc(s.description)}')">✓</button>` : ''}
            <button class="icon-btn" title="Downtime" onclick="openDowntimeModal('service','${esc(s.host_name)}','${esc(s.description)}')">⏱</button>
          </td>
        </tr>`;
      });
      body.innerHTML = html;
    }
  }

  const start = S.total ? S.offset + 1 : 0;
  const end = Math.min(S.offset + limit, S.total);
  document.getElementById('pager-info').textContent = `Showing ${start}–${end} of ${S.total.toLocaleString()}`;
  document.getElementById('prev-btn').disabled = S.offset === 0;
  document.getElementById('next-btn').disabled = end >= S.total;
}

async function loadDowntimes() {
  const data = await (await fetch('/api/v1/downtimes')).json();
  const dts = data.downtimes || [];
  const body = document.getElementById('dt-body');
  if (!dts.length) {
    body.innerHTML = '<tr><td colspan="6" class="empty">No active or scheduled downtimes</td></tr>';

  body.innerHTML = dts.map(d => {
    const isSvc = d.type === 1;

}
function submitAck(kind, host, desc) {
  const cmt = document.getElementById('m-ack-cmt').value.trim() || 'Acknowledged';
  const sticky = document.getElementById('m-ack-sticky').checked ? 2 : 1;
  const notify = document.getElementById('m-ack-notify').checked ? 1 : 0;
  const cmd = kind === 'host'
    ? `ACKNOWLEDGE_HOST_PROBLEM;${host};${sticky};${notify};1;encore-ui;${cmt}`
    : `ACKNOWLEDGE_SVC_PROBLEM;${host};${desc};${sticky};${notify};1;encore-ui;${cmt}`;
  closeModal();
  sendCmd(cmd, 'Acknowledge');
}

    <div class="modal-foot">

      <button class="btn primary" onclick="submitDowntime('${kind}','${esc(host)}','${esc(desc)}')">Schedule</button>
    </div>`);
}
function submitDowntime(kind, host, desc) {
  const mins = Math.max(1, Number(document.getElementById('m-dt-min').value) || 60);
  const cmt = document.getElementById('m-dt-cmt').value.trim() || 'Maintenance';
  const now = Math.floor(Date.now()/1000);
  const cmd = kind === 'host'
    ? `SCHEDULE_HOST_DOWNTIME;${host};${now};${now+mins*60};1;0;0;encore-ui;${cmt}`
    : `SCHEDULE_SVC_DOWNTIME;${host};${desc};${now};${now+mins*60};1;0;0;encore-ui;${cmt}`;
  closeModal();
  sendCmd(cmd, 'Schedule downtime');
}

async function apiPost(url, payload, okMsg) {
  try {
    const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || res.statusText);
    closeModal();
    toast(okMsg + ' (click Apply & Reload to activate)');
    await loadManage();
    await loadMeta();
  } catch (e) { toast('Error: ' + e.message); }
}

}
async function deleteManagedSvc(host, desc) {
  if (!confirm(`Delete service "${host}/${desc}"?`)) return;
  await deleteManagedItem('services', `host=${encodeURIComponent(host)}&description=${encodeURIComponent(desc)}`);
}
async function deleteManagedItem(kind, qs) {
  const res = await fetch(`/api/v1/config/${kind}?${qs}`, { method:'DELETE' });
  const d = await res.json();
  if (!res.ok) { toast('Error: ' + (d.error || res.statusText)); return; }
  toast('Deleted (click Apply & Reload)');
  await loadManage(); await loadMeta();
}
async function runValidate(apply) {
  const con = document.getElementById('validate-console');
  con.style.display = 'block';
  con.textContent = apply ? 'Validating and applying config...' : 'Running nagios -v...';
  const res = await fetch(apply ? '/api/v1/config/apply' : '/api/v1/config/validate', { method:'POST' });
  const d = await res.json();
  con.textContent = (d.error ? 'ERROR: ' + d.error + '\n\n' : 'OK\n\n') + (d.output || '');
  toast(res.ok ? (apply ? 'Applied & Nagios reloading!' : 'Config valid!') : 'Validation failed');
  if (res.ok && apply) { await loadManage(); setTimeout(refreshAll, 1500); }
}
async function rollbackBackup(name) {
  if (!confirm(`Rollback managed config to ${name}?`)) return;
  const res = await fetch('/api/v1/config/rollback', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({backup:name}) });
  const d = await res.json();
  toast(res.ok ? 'Rolled back & reloading!' : ('Rollback failed: ' + d.error));
  if (res.ok) { await loadManage(); setTimeout(refreshAll, 1500); }
}

async function refreshAll() {
  try {
    await loadMeta();
    if (['services','hosts','problems'].includes(S.tab)) await loadTable();
    else if (S.tab === 'groups') loadGroups();
    else if (S.tab === 'downtimes') await loadDowntimes();
  } catch (e) {
    document.getElementById('conn-dot').classList.add('off');
    document.getElementById('conn-label').textContent = 'Offline';
  }
}

populateStateSelect();
refreshAll();
setInterval(() => { if (S.auto) refreshAll(); }, 3000);
</script>
